services:
  db:
    image: pgvector/pgvector:pg16
    container_name: intranet-db
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intranet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intranet_pw}
      POSTGRES_DB: ${POSTGRES_DB:-intranet}
    # 호스트 루프백만 — 인트라넷에는 HTTP(Nginx)만 공개
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-intranet} -d ${POSTGRES_DB:-intranet}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: intranet-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    container_name: intranet-app
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-intranet}:${POSTGRES_PASSWORD:-intranet_pw}@db:5432/${POSTGRES_DB:-intranet}?schema=public"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8080}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NODE_ENV: production
      BUILD_ID: ${BUILD_ID:-dev}
      NEXT_PUBLIC_BUILD_ID: ${BUILD_ID:-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      ALLOWED_IP_PREFIXES: ${ALLOWED_IP_PREFIXES:-127.0.0.1,10.,172.16.,192.168.}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRISMA_MIGRATE_DEPLOY: ${PRISMA_MIGRATE_DEPLOY:-true}
      PRISMA_ACCEPT_DATA_LOSS: ${PRISMA_ACCEPT_DATA_LOSS:-false}
      # RUN_SEED, RUN_DEMO_SEED, RUN_DEALER_DEMO_SEED → .env.production (env_file)
      BEHIND_NGINX: "true"
      # CLAMAV_HOST: ${CLAMAV_HOST:-}
    volumes:
      - uploads-data:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1536M
    # App 직접 접근이 필요할 때만 아래 주석 해제.
    # 호스트 3000은 다른 서비스와 충돌하기 쉬우므로 기본 3001 사용.
    # ports:
    #   - "127.0.0.1:${APP_PORT:-3001}:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: intranet-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # 사내망 다른 PC 접속용 — 0.0.0.0 바인딩 (기본 포트 8080, 3000 사용 안 함)
    ports:
      - "0.0.0.0:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
    name: intranet-postgres-data
  uploads-data:
    name: intranet-uploads-data
  redis-data:
    name: intranet-redis-data
