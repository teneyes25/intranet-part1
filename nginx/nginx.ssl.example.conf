# HTTPS 예시 — Let's Encrypt (certbot) 또는 자체 인증서
# 1) 인증서를 ./nginx/certs/ 에 배치
# 2) docker-compose.yml nginx volumes 에 마운트
# 3) 아래 server 블록을 nginx.conf 에 추가하거나 include

upstream intranet_app {
  server app:3000;
  keepalive 32;
}

# HTTP → HTTPS 리다이렉트
server {
  listen 80;
  server_name intranet.company.local;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name intranet.company.local;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  client_max_body_size 120m;

  proxy_hide_header Strict-Transport-Security;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;

  location / {
    proxy_pass http://intranet_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

# Let's Encrypt (certbot standalone 예시 — 최초 발급)
# certbot certonly --standalone -d intranet.company.local
# docker compose exec nginx nginx -s reload

# .env.production 변경 필수:
# NEXTAUTH_URL=https://intranet.company.local
# ALLOWED_ORIGINS=https://intranet.company.local
