upstream intranet_app {
  server app:3000;
  keepalive 32;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

# 업스트림(Next.js) 보안 헤더 숨김 — Nginx 단일 소스
map $upstream_http_x_frame_options $skip_upstream_security {
  default 1;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 15m;
  proxy_buffering on;
  proxy_buffer_size 16k;
  proxy_buffers 4 32k;

  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header X-XSS-Protection;
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header Content-Security-Policy;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.openai.com https://openapi.naver.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /_next/static/ {
    proxy_pass http://intranet_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache_valid 200 7d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://intranet_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
